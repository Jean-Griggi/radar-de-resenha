services:
  postgres:
    image: postgres:16-alpine
    container_name: resenhometro-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: resenhometro
      POSTGRES_PASSWORD: resenhometro
      POSTGRES_DB: resenhometro
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
