services:
  - type: web
    name: resenhometro-api
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @resenhometro/api build
    startCommand: pnpm --filter @resenhometro/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_API_URL
        value: https://resenhometro-api.onrender.com
      - key: WEB_ORIGIN
        value: https://resenhometro-web.vercel.app
      - key: CORS_ORIGINS
        value: https://resenhometro-web.vercel.app
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://resenhometro-api.onrender.com/spotify/callback
      - key: DATABASE_URL
        sync: false
